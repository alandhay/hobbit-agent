# hobbit-agent configuration (local Windows run).

tape = "data/game/hobbit.tzx"      # your own copy of the game; restarts Fuse with it for each attempt
specbot_config = "specbot.toml"    # Fuse window, capture and launch settings (48K)

[pace]
move_interval_seconds = 300        # one move every 5 minutes
clock = "paused"                   # the emulator is frozen while the agent thinks

[brain]
backend = "agent_sdk"              # uses the Claude Code login on this machine (no API key)
move_model = "claude-haiku-5-5"    # routine moves ("" = every move goes to `model`)
model = "claude-sonnet-5-5"        # moves that need judgment, stuck reviews, reflection
effort = "medium"
escalate_below_confidence = 0.6    # a routine move this unsure is redone by `model`

[limits]
max_moves_per_attempt = 300
max_stale_moves = 50               # this many moves without progress (no new place, character or object) -> fail:stuck
stuck_review_every = 10            # every 10 such moves, step back: keep trying (with a new plan) or resign
daily_cost_cap_usd = 25.0          # notional cost reported by the SDK; ends the run when reached

[learning]
allow_human_hints = false          # review notes stay out of the agent's knowledge unless true

[server]
host = "127.0.0.1"
port = 8800
